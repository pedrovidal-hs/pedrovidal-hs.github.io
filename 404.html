<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#fafbf7">
    <title>Página não encontrada | Neusa Vidal</title>
    <!-- Páginas de erro não devem ser indexadas -->
    <meta name="robots" content="noindex, follow">

    <link rel="icon" href="favicon.ico" sizes="32x32">
    <link rel="icon" type="image/png" href="img/mark-192.png" sizes="192x192">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
    <link rel="preload" href="font/glacial-indifference.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="font/afrah-regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="css/styles.css">
  </head>

  <body>
    <main class="hero" style="min-height: 100vh; display: grid; place-content: center;">
      <div class="container container--narrow">
        <img class="hero__mark" src="img/mark-192.png" width="175" height="192"
             alt="Logotipo Neusa Vidal">

        <p class="eyebrow" style="justify-content: center;">Erro 404</p>
        <h1 class="hero__title" style="font-size: var(--step-4);">Esta página não existe</h1>

        <p class="lead hero__lead">
          O endereço pode ter mudado ou o link estar incorreto. Todo o conteúdo do site
          está na página inicial.
        </p>

        <div class="hero__actions">
          <a class="btn btn--primary" href="/">Ir para a página inicial</a>
          <a class="btn btn--ghost" href="/#contato">Falar com a Neusa</a>
        </div>
      </div>
    </main>
  </body>
</html>
